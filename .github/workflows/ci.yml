name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The libraries, the CLI and the suite target net8.0, net9.0 and net10.0, so the
      # runner needs the runtime of each one. The SDK itself is pinned by global.json:
      # targeting net10.0 needs a .NET 10 SDK.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Show installed runtimes
        run: dotnet --list-runtimes

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # No filter on the framework: this runs the unit tests once per target framework,
      # which is the cheapest proof that the code compiles and runs on all three.
      - name: Unit tests
        run: dotnet test --configuration Release --no-build --filter "FullyQualifiedName~Unit"

  integration:
    runs-on: ubuntu-latest
    # The integration suite starts a container per engine. Running the three engines as
    # separate jobs keeps one engine's failure from hiding the others' results.
    strategy:
      fail-fast: false
      matrix:
        engine: [MsSql, PostgreSql, MySql]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # One leg per supported runtime, in one job so the database image is pulled once
      # instead of once per framework. Each leg runs on its own runtime: the net8.0 leg
      # on .NET 8, the net9.0 leg on .NET 9, the net10.0 leg on .NET 10.
      - name: Integration tests (net8.0)
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --framework net8.0
          --filter "FullyQualifiedName~${{ matrix.engine }}HarnessTests"

      - name: Integration tests (net9.0)
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --framework net9.0
          --filter "FullyQualifiedName~${{ matrix.engine }}HarnessTests"

      - name: Integration tests (net10.0)
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --framework net10.0
          --filter "FullyQualifiedName~${{ matrix.engine }}HarnessTests"
